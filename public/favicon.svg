<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#881337" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle for clear contrast on both dark and light browser tabs -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#f43f5e" stroke-width="1.5"/>

  <!-- Flower group with shadow -->
  <g filter="url(#shadow)">
    <!-- Layer 1: Outer petals (8 petals) -->
    <g fill="url(#petalGrad1)">
      <circle cx="32" cy="18" r="9"/>
      <circle cx="41.9" cy="22.1" r="9"/>
      <circle cx="46" cy="32" r="9"/>
      <circle cx="41.9" cy="41.9" r="9"/>
      <circle cx="32" cy="46" r="9"/>
      <circle cx="22.1" cy="41.9" r="9"/>
      <circle cx="18" cy="32" r="9"/>
      <circle cx="22.1" cy="22.1" r="9"/>
    </g>

    <!-- Layer 2: Mid petals -->
    <g fill="url(#petalGrad2)">
      <circle cx="35.8" cy="19.6" r="7.5"/>
      <circle cx="44.4" cy="26.2" r="7.5"/>
      <circle cx="45.6" cy="35.8" r="7.5"/>
      <circle cx="38.8" cy="43.4" r="7.5"/>
      <circle cx="28.2" cy="44.4" r="7.5"/>
      <circle cx="19.6" cy="37.8" r="7.5"/>
      <circle cx="18.4" cy="28.2" r="7.5"/>
      <circle cx="25.2" cy="20.6" r="7.5"/>
    </g>

    <!-- Layer 3: Inner delicate blossom petals -->
    <g fill="#fff1f2" opacity="0.9">
      <circle cx="32" cy="25" r="4.5"/>
      <circle cx="37" cy="28" r="4.5"/>
      <circle cx="37" cy="34" r="4.5"/>
      <circle cx="32" cy="37" r="4.5"/>
      <circle cx="27" cy="34" r="4.5"/>
      <circle cx="27" cy="28" r="4.5"/>
    </g>

    <!-- Pistil: Golden center -->
    <circle cx="32" cy="32" r="6" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="0.75"/>
    <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
